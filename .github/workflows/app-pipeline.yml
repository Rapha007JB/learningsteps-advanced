name: Application CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - "app/**"
      - "k8s/**"
      - ".github/workflows/app-pipeline.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "app/**"
      - "k8s/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: learningsteps-api
  NAMESPACE: learningsteps

jobs:
  # ==================================================
  # Stage 1a: Lint and unit tests
  # ==================================================
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest -q

  # ==================================================
  # Stage 1b: Secret scan (full git history, verified secrets only)
  # ==================================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog - fail on verified secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" \
            trufflesecurity/trufflehog@sha256:8fd07ea46a3f59583c4d50f006d8cf150530141b28969c3c34cc455cb9165a6b \
            git file:///repo --no-update --results=verified --fail

  # ==================================================
  # Stage 1c: Dependency vulnerability scan
  # ==================================================
  code-scan:
    name: Scan Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "./app"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  # ==================================================
  # Stage 2: Build, scan the image, push to ACR
  # ==================================================
  build-scan-push:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest
    needs: [lint-and-test, secret-scan, code-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:ci app

      - name: Trivy image scan (fails on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:ci"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Login to ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Tag and push image to ACR
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:ci ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Save image tag
        if: github.event_name != 'pull_request'
        run: echo "${{ github.run_number }}" > image_tag.txt

      - name: Upload image tag artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_tag.txt
          retention-days: 1

  # ==================================================
  # Stage 3: Deploy to AKS and verify the rollout
  # ==================================================
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download image tag
        uses: actions/download-artifact@v4
        with:
          name: image-tag

      - name: Configure kubectl (verified TLS, namespace-scoped token)
        env:
          K8S_SERVER: ${{ secrets.K8S_SERVER }}
          K8S_TOKEN: ${{ secrets.K8S_TOKEN }}
          K8S_CA_DATA: ${{ secrets.K8S_CA_DATA }}
        run: |
          echo "$K8S_CA_DATA" | base64 -d > "$RUNNER_TEMP/ca.crt"
          kubectl config set-cluster aks --server="$K8S_SERVER" \
            --certificate-authority="$RUNNER_TEMP/ca.crt" --embed-certs=true
          kubectl config set-credentials github-deployer --token="$K8S_TOKEN"
          kubectl config set-context aks --cluster=aks --user=github-deployer --namespace="$NAMESPACE"
          kubectl config use-context aks

      - name: Deploy new image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          IMAGE_TAG=$(cat image_tag.txt)
          sed "s|image:.*learningsteps-api:.*|image: ${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}|g" \
            k8s/deployment.yaml | kubectl apply -n "$NAMESPACE" -f -
          kubectl apply -n "$NAMESPACE" -f k8s/service.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/learningsteps-api -n "$NAMESPACE" --timeout=180s
          kubectl get pods -l app=learningsteps-api -n "$NAMESPACE"
          kubectl get svc learningsteps-api -n "$NAMESPACE"
