name: Infrastructure Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - "infra-terraform/**"
      - ".trivyignore"
      - ".github/workflows/infra-pipeline.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "infra-terraform/**"
  workflow_dispatch:
    inputs:
      terraform_version:
        description: "Terraform version to use"
        required: false
        default: "1.16.6"
        type: string

permissions:
  contents: read

env:
  WORKING_DIR: infra-terraform
  TF_VERSION: ${{ inputs.terraform_version || '1.16.6' }}

jobs:
  # ============================================
  # Always runs - no Azure credentials needed
  # ============================================
  security-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy IaC scan (fails on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "config"
          scan-ref: "${{ env.WORKING_DIR }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: tfsec (informational report)
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: ${{ env.WORKING_DIR }}
          additional_args: --tfvars-file ${{ env.WORKING_DIR }}/terraform.tfvars
          soft_fail: true

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend - just download providers)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # Plan and apply are intentionally not run from CI in this project:
  # creating the service principal they need is not permitted in this subscription.
  # Infrastructure changes are applied manually with terraform plan / apply.
