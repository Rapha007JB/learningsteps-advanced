# Tells the Secrets Store CSI driver which Key Vault secret to mount and
# to sync into a Kubernetes Secret named learningsteps-secrets.
# __TENANT_ID__ and __KV_CLIENT_ID__ are replaced at apply time (never committed).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: learningsteps-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "__KV_CLIENT_ID__"
    keyvaultName: "kv-ls-8024"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
  secretObjects:
    - secretName: learningsteps-secrets
      type: Opaque
      data:
        - objectName: database-url
          key: database-url
